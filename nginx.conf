# BuildHealth frontend nginx config
# =================================
# Two responsibilities:
#   1. Serve the SPA (Vite build output) and fall back to index.html
#      for client-side routes (e.g. /retrofit, /buildings/3).
#   2. Reverse-proxy /api/* to the `backend` service. In docker-compose
#      the service name `backend` resolves via Docker's embedded DNS, so
#      no hard-coded IP is needed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets emitted by Vite under /assets/
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API → backend service (Docker DNS resolves `backend`)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-friendly timeouts for the AI endpoint
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # OpenAPI / docs (served by FastAPI in the backend container)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback — everything else is a client-side route
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Light healthcheck endpoint for the frontend container itself
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
